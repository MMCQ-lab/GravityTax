    :root { color-scheme: dark; background: #070918; }
    html, body, #canvas { width: 100%; height: 100%; margin: 0; padding: 0; border: 0; }
    body { overflow: hidden; background: radial-gradient(circle at 50% 32%, #192a51 0%, #070918 60%); touch-action: none; }
    #canvas { display: block; outline: none; }
    #mmcq-loading { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(18px, 4vh, 36px); padding: 24px; background: radial-gradient(circle at 50% 36%, #1a315a 0%, #070918 63%); transition: opacity .35s ease, visibility .35s ease; }

    #mmcq-logo { width: min(62vw, 290px); max-height: 42vh; object-fit: contain; filter: drop-shadow(0 0 26px rgba(145,255,72,.25)); animation: logo-in .55s ease-out both; }
    #mmcq-studio { margin-top: -12px; color: #f7fbff; font: 700 clamp(13px, 2.7vw, 18px)/1.1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .22em; text-indent: .22em; }
    #mmcq-progress-wrap { width: min(74vw, 320px); height: 9px; overflow: hidden; border: 1px solid rgba(219,255,199,.42); border-radius: 99px; background: rgba(255,255,255,.12); box-shadow: 0 5px 18px rgba(0,0,0,.28); }
    #mmcq-progress { display: block; width: 0%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #91ff48, #55e4ff); transition: width .16s ease; }
    #mmcq-status { min-height: 1.25em; color: rgba(237,246,255,.82); font: 500 13px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
    #mmcq-error { display: none; max-width: min(88vw, 500px); padding: 14px; border: 1px solid #fd8686; border-radius: 12px; background: rgba(95, 22, 38, .86); color: #fff; font: 14px/1.35 system-ui, sans-serif; text-align: center; white-space: pre-wrap; }
    @keyframes logo-in { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
    @media (max-height: 520px) { #mmcq-logo { width: min(38vw, 185px); max-height: 44vh; } #mmcq-loading { gap: 12px; } }

  <script>
  const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":47239228,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
  const GODOT_THREADS_ENABLED = false;
  const engine = new Engine(GODOT_CONFIG);
  (() => {
    const overlay = document.getElementById('mmcq-loading');
    const logoSource = document.getElementById('mmcq-logo').src;
    document.getElementById('mmcq-favicon').href = logoSource;
    document.getElementById('mmcq-apple-icon').href = logoSource;
    const progress = document.getElementById('mmcq-progress');
    const status = document.getElementById('mmcq-status');
    const errorBox = document.getElementById('mmcq-error');
    let loadTimeoutId = 0;
    let failed = false;
    const showFailure = (error) => {
      if (failed) return;
      failed = true;
      window.clearTimeout(loadTimeoutId);
      console.error(error);
      progress.style.width = '100%';
      progress.style.background = '#fd8686';
      status.textContent = 'Unable to start Jelly Swing Arcade';
      errorBox.textContent = error instanceof Error ? error.message : String(error);
      errorBox.style.display = 'block';
    };
    const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
    if (missing.length) {
      showFailure(`This browser is missing required features:\n${missing.join('\n')}`);
      return;
    }
    loadTimeoutId = window.setTimeout(() => {
      showFailure(new Error('Loading timed out. Check your connection, then refresh this page.'));
    }, 120000);
    engine.startGame({
      onProgress: (current, total) => {
        if (current > 0 && total > 0) {
          const percent = Math.round((current / total) * 100);
          progress.style.width = `${percent}%`;
          status.textContent = `Loading Jelly Swing Arcade… ${percent}%`;

          status.textContent = 'Preparing Jelly Swing Arcade…';
