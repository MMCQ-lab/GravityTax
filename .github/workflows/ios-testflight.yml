name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload the signed IPA to App Store Connect (TestFlight)?"
        required: true
        default: false
        type: boolean
      build_number_offset:
        description: "Optional number added to GitHub run number; use if App Store Connect already has a higher build."
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  build-ios:
    name: Build signed iOS IPA
    runs-on: macos-14
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.7.2
      EXPORT_PRESET: Jelly Swing Arcade
      BUNDLE_ID: com.mmcqlab.jellyswing
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_PROVISIONING_PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Xcode 16.2 is available on macos-14 and is compatible with modern App Store submissions.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Install Godot and matching export templates
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Decode signing certificate and provisioning profile
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/AppleDistribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/JellySwing.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          # Verify the certificate using Homebrew OpenSSL 3
          echo "Checking certificate and password..."
          brew install openssl@3
          OPENSSL_BIN="$(brew --prefix openssl@3)/bin/openssl"

          if "$OPENSSL_BIN" pkcs12 \
            -legacy \
            -in "$CERT_PATH" \
            -passin env:APPLE_CERTIFICATE_PASSWORD \
            -noout; then
            echo "Certificate password verified successfully."
          else
            echo "::error::PKCS12 verification failed."
            exit 1
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Export Godot project to Xcode
        run: |
          set -euo pipefail
          mkdir -p build/ios
          godot --headless --path "$GITHUB_WORKSPACE" --import
          godot --headless --path "$GITHUB_WORKSPACE" --export-release "$EXPORT_PRESET" "build/ios/JellySwing.xcodeproj"
          test -d build/ios/JellySwing.xcodeproj

      - name: Set an automatically incrementing build number
        id: build_number
        run: |
          set -euo pipefail
          OFFSET="${{ inputs.build_number_offset }}"
          [[ "$OFFSET" =~ ^[0-9]+$ ]] || { echo "build_number_offset must be a non-negative integer"; exit 1; }
          BUILD_NUMBER=$(( GITHUB_RUN_NUMBER + OFFSET ))
          echo "number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Using CFBundleVersion: $BUILD_NUMBER"

      - name: Archive signed App Store build
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.number }}
        run: |
          set -euo pipefail
          XCODE_PROJECT="$(find build/ios -name '*.xcodeproj' -print -quit)"
          SCHEME="$(xcodebuild -list -json -project "$XCODE_PROJECT" | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/JellySwing.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$APPLE_PROVISIONING_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION='1.0.0' \
            clean archive

      - name: Export App Store IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key><dict>
              <key>com.mmcqlab.jellyswing</key><string>${APPLE_PROVISIONING_PROFILE_NAME}</string>
            </dict>
          </dict></plist>
          PLIST
          # Substitute only non-secret signing identifiers into the temporary file.
          /usr/bin/sed -i '' "s/\${APPLE_TEAM_ID}/$APPLE_TEAM_ID/g; s/\${APPLE_PROVISIONING_PROFILE_NAME}/$APPLE_PROVISIONING_PROFILE_NAME/g" "$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p build/ipa
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/JellySwing.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ipa
          test -f build/ipa/*.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jelly-Swing-Arcade-${{ steps.build_number.outputs.number }}
          path: build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect for TestFlight
        if: ${{ inputs.upload_to_testflight == true }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file build/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
