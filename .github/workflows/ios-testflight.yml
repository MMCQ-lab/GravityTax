name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload the signed IPA to App Store Connect (TestFlight)?"
        required: true
        default: false
        type: boolean
      build_number_offset:
        description: "Optional number added to GitHub run number; use if App Store Connect already has a higher build."
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate project and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Import project and check every script parses
        run: |
          set -euo pipefail
          godot --headless --path "$GITHUB_WORKSPACE" --import
          status=0
          for script in $(git ls-files '*.gd'); do
            if ! output=$(godot --headless --path "$GITHUB_WORKSPACE" --check-only --script "res://$script" 2>&1) || echo "$output" | grep -q "SCRIPT ERROR"; then
              echo "::error file=$script::Script failed to parse"
              echo "$output"
              status=1
            fi
          done
          exit $status

      - name: Run automated tests
        run: godot --headless --path "$GITHUB_WORKSPACE" -s res://tests/run_tests.gd

  build-ios:
    name: Build signed iOS IPA
    needs: validate
    runs-on: macos-26
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.7.2
      EXPORT_PRESET: Jelly Swing Arcade
      BUNDLE_ID: com.mmcqlab.jellyswing
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_PROVISIONING_PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Xcode 16.2 is available on macos-14 and is compatible with modern App Store submissions
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Install Godot and matching export templates
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      # The AdMob export plugin runs `ruby` with the xcodeproj gem to add the
      # Google Mobile Ads Swift package. Pin a Ruby so `ruby` and the gem match.
      - name: Set up Ruby for the AdMob export helper
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install AdMob iOS package helper
        run: |
          set -euo pipefail
          gem install xcodeproj --no-document
          ruby -e 'require "xcodeproj"; puts "xcodeproj #{Xcodeproj::VERSION} OK with Ruby #{RUBY_VERSION} at #{RbConfig.ruby}"'

      - name: Decode signing certificate and provisioning profile
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/AppleDistribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/JellySwing.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          # Verify the certificate using Homebrew OpenSSL 3
          echo "Checking certificate and password..."
          brew install openssl@3
          OPENSSL_BIN="$(brew --prefix openssl@3)/bin/openssl"

          if "$OPENSSL_BIN" pkcs12 \
            -legacy \
            -in "$CERT_PATH" \
            -passin env:APPLE_CERTIFICATE_PASSWORD \
            -noout; then
            echo "Certificate password verified successfully."
          else
            echo "::error::PKCS12 verification failed."
            exit 1
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Export Godot project to Xcode
        run: |
          set -euo pipefail
          mkdir -p build/ios
          godot --headless --path "$GITHUB_WORKSPACE" --import
          godot --headless --path "$GITHUB_WORKSPACE" --export-release "$EXPORT_PRESET" "build/ios/JellySwing.xcodeproj" 2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          # Fail before signing if the native plugin or Google SDK was omitted,
          # and surface the plugin's own messages as annotations so the cause
          # is visible on the run page without opening the full log.
          report() {
            echo "::error::$1"
            grep -E 'SPM|Admob|AdMob|xcodeproj|ruby|ERROR' "$RUNNER_TEMP/godot-export.log" | grep -v 'savepack' | tail -25 | while IFS= read -r line; do echo "::error::export: ${line:0:300}"; done
            exit 1
          }
          test -d build/ios/JellySwing.xcodeproj || report "Godot did not create the Xcode project"
          # Godot 4.7.2 skips the AdMob plugin's post-export hook for project-only
          # exports, so add the Google Mobile Ads Swift package here.
          ruby scripts/add_admob_spm.rb build/ios/JellySwing.xcodeproj || report "Could not add the Google Mobile Ads Swift package"
          xcodebuild -resolvePackageDependencies -project build/ios/JellySwing.xcodeproj || report "Swift package resolution failed"
          grep -q 'AdmobPlugin' build/ios/JellySwing.xcodeproj/project.pbxproj || report "AdmobPlugin missing from Xcode project"
          grep -q 'GoogleMobileAds' build/ios/JellySwing.xcodeproj/project.pbxproj || report "GoogleMobileAds Swift package missing from Xcode project"
          grep -q 'GADApplicationIdentifier' build/ios/JellySwing/JellySwing-Info.plist || report "GADApplicationIdentifier missing from Info.plist"

      - name: Set an automatically incrementing build number
        id: build_number
        run: |
          set -euo pipefail
          OFFSET="${{ inputs.build_number_offset }}"
          [[ "$OFFSET" =~ ^[0-9]+$ ]] || { echo "build_number_offset must be a non-negative integer"; exit 1; }
          BUILD_NUMBER=$(( GITHUB_RUN_NUMBER + OFFSET ))
          echo "number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Using CFBundleVersion: $BUILD_NUMBER"

      - name: Archive signed App Store build
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.number }}
        run: |
          set -euo pipefail
          # Marketing version comes from project.godot (config/version), e.g. 1.0.0
          MARKETING_VERSION="$(sed -n 's/^config\/version="\([0-9][0-9.]*\)"$/\1/p' project.godot)"
          [[ "$MARKETING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::config/version in project.godot must be semantic (x.y.z)"; exit 1; }
          echo "Marketing version: $MARKETING_VERSION, build: $BUILD_NUMBER"
          XCODE_PROJECT="$(find build/ios -name '*.xcodeproj' -print -quit)"
          SCHEME="$(xcodebuild -list -json -project "$XCODE_PROJECT" | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')"
          # Signing goes on the app target only; Swift package targets (Google
          # Mobile Ads, UMP) reject a provisioning profile set globally.
          ruby scripts/set_ios_signing.rb "$XCODE_PROJECT" "$APPLE_TEAM_ID" "$APPLE_PROVISIONING_PROFILE_NAME" "$BUNDLE_ID"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/JellySwing.xcarchive" \
            CODE_SIGNING_ALLOWED=YES \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            clean archive

      - name: Export App Store IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key><dict>
              <key>com.mmcqlab.jellyswing</key><string>${APPLE_PROVISIONING_PROFILE_NAME}</string>
            </dict>
          </dict></plist>
          PLIST
          # Substitute only non-secret signing identifiers into the temporary file.
          /usr/bin/sed -i '' "s/\${APPLE_TEAM_ID}/$APPLE_TEAM_ID/g; s/\${APPLE_PROVISIONING_PROFILE_NAME}/$APPLE_PROVISIONING_PROFILE_NAME/g" "$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p build/ipa
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/JellySwing.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ipa
          test -f build/ipa/*.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jelly-Swing-Arcade-${{ steps.build_number.outputs.number }}
          path: build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect for TestFlight
        if: ${{ inputs.upload_to_testflight == true }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file build/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
